<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient</title>
    <style>
        .box {
            height: 200px;
            width: 200px;
            border: 2px solid black;
            background-color: red;
            background: linear-gradient(orange, white, green);
        }

        .box2 {
            height: 200px;
            width: 200px;
            /* background-color: red; */
            border: 2px solid black;
            background: linear-gradient(to right, orange, white, green);
        }

        .box3 {
            height: 200px;
            width: 200px;
            background-color: red;
            border: 2px solid black;
            background: radial-gradient(green, white, orange);
        }

        .box4 {
            height: 200px;
            width: 200px;
            /* background-color: red; */
            border: 2px solid black;
            background: linear-gradient(to bottom right, orange, white, green);
        }
        .box5{
            height: 300px;
            width: 400px;
            border: 2px solid black;
            background: radial-gradient(circle,orange, white, green);
        }
        .box6{
            height: 300px;
            width: 400px;
            border: 2px solid black;
            background: radial-gradient(ellipse,orange, white, green);
        }
    </style>
</head>

<body>
    <div class="box">linear</div>

    <br><br>

    <div class="box2">to right</div>

    <br><br>

    <div class="box3">radial</div>

    <br><br>

    <div class="box4">to corner</div>

    <br><br>

    <div class="box5">circle</div>

    <br><br>

    <div class="box6">ellipse</div>
</body>

</html>
