<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Layout</title>
</head>

<body>

    <table width="70%" height="600" align="center" border="1" cellspacing="5">

        <!-- Header -->
        <tr height="80">
            <td colspan="3" align="center">
                <b>Header</b>
            </td>
        </tr>

        <!-- Navigation, Content and Sidebar -->
        <tr height="400">

            <td width="20%" align="center">
                <b>Navigation</b>
            </td>

            <td width="55%" align="center">
                <b>Content</b>
            </td>

            <td width="25%" align="center" valign="top">
                <b>Sidebar</b>
            </td>

        </tr>

        <!-- Footer -->
        <tr height="70">
            <td colspan="3" align="center">
                <b>Footer</b>
            </td>
        </tr>

    </table>

</body>

</html>
