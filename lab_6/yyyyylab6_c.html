<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Website Layout</title>

    <style>

        *{
            border: 1px solid black;
        }

        body {
            margin: 0;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .top {
            height: 55px;
            background-color: black;
            margin: 5px 10px;
        }

        .website {
            width: 72%;
            margin: 5px auto;
        }

        .header {
            height: 80px;
            background-color: #c9232d;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .layout {
            display: grid;

            grid-template-columns: 1fr 3fr 1fr;

            grid-template-rows: 220px 100px;

            column-gap: 10px;
            row-gap: 0;

            margin-top: 5px;
        }

        .navigation {
            background-color: #30369a;

            grid-column: 1;
            grid-row: 1 / 3;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .content {
            background-color: #fff01a;

            grid-column: 2;
            grid-row: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            color: black;
            font-size: 18px;
            font-weight: bold;
        }

        .sidebar {
            background-color: #006b3c;

            grid-column: 3;
            grid-row: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 18px;
            font-weight: bold;

            margin: 5px;
        }

        .content-bottom {
            background-color: #fff01a;

            grid-column: 2 / 4;
            grid-row: 2;

            display: flex;
            justify-content: center;
            align-items: center;

            color: black;
            font-size: 18px;
            font-weight: bold;
        }

        .footer {
            height: 80px;
            background-color: #29a9df;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 20px;
            font-weight: bold;

            margin-top: 10px;
        }

        .bottom {
            height: 55px;
            background-color: black;
            margin: 5px 10px;
        }

    </style>

</head>

<body>

    <div class="top"></div>

    <div class="website">

        <div class="header">
            Header
        </div>

        <div class="layout">

            <div class="navigation">
                Navigation
            </div>

            <div class="content" style="border-bottom: yellow;">
                Content
            </div>

            <div class="sidebar">
                Sidebar
            </div>

            <div class="content-bottom" style="border-top: yellow;">
                <!-- Content -->
            </div>

        </div>

        <div class="footer">
            Footer
        </div>

    </div>

    <div class="bottom"></div>

</body>

</html>
