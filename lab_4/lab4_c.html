<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <fieldset width="100px">
        <h1>
            <center>
                <legend>Creat Account</legend>
            </center>
        </h1>

        <form action="">
            <table >
                <tr>
                    <td><label for="">First Name</label></td>
                    <td><input type="text" name="" id="" placeholder="Enter First Name"></td>

                    <td><label for="">Last Name</label></td>
                    <td><input type="text" name="" id="" placeholder="Enter Last Name"></td>
                </tr>

                <tr>
                    <td><br></td>
                </tr>

                <tr>
                    <td><label for="">Email</label></td>
                    <td><input type="email" placeholder="Enter Email"></td>
                </tr>

                <tr>
                    <td><br></td>
                </tr>

                <tr>
                    <td><label for="">Password</label></td>
                    <td><input type="password" placeholder="Enter Password"></td>

                    <td><label for="">Confirm Password</label></td>
                    <td><input type="password" placeholder="Enter password"></td>
                </tr>

                <tr>
                    <td><br></td>
                </tr>

                <tr>
                    <td><label for="">gender</label></td>
                    <td>
                        <input type="radio" id="male" name="gender" value="Male">
                        <label for="">Male</label>

                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="">Female</label>
                    </td>

                    <td><label for="">Hobbies</label></td>
                    <td>
                        <input type="checkbox" id="music" name="Hobbies" value="Music"><label for="">Music</label>
                        <input type="checkbox" id="sports" name="Hobbies" value="Sports"><label for="">Sports</label>
                        <input type="checkbox" id="Travels" name="Hobbies" value="travels"><label for="">travels</label>
                        <input type="checkbox" id="movie" name="Hobbies" value="Movie"><label for="">Movie</label>
                    </td>
                </tr>

                <tr>
                    <td><br></td>
                </tr>

                <tr>
                    <td><label>Souce of Income</label></td>
                    <td>
                        <select>
                            <option selected disabled>Employed</option>
                            <option>Employed</option>
                            <option>Bussiness</option>
                            <option>Shopkepper</option>
                            <option>Farming</option>
                        </select>
                    </td>

                    <td><label for="">Income</label></td>
                    <td>0<input type="range" name="" id="" min="0" max="20,000">20k</td>
                </tr>

                <tr>
                    <td><br></td>
                </tr>

                <tr>
                    <td><label for="">Upload Profile picture</label></td>
                    <td><input type="file"></td>

                    <td><label for="">Age</label></td>
                    <td><input type="age" name="" id="" placeholder="Enter Your Age"></td>
                </tr>

                <tr>
                    <td><br></td>
                </tr>

                <tr>
                    <td><label for="">Bio</label></td>
                    <td><textarea name="" id=""></textarea></td>
                </tr>

                <tr>
                    <td align="center"><button type="submit">Creat</button></td>
                </tr>


            </table>
        </form>
    </fieldset>
</body>

</html>
