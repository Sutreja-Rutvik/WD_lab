<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>Student Registration</h1>
        <table>
                <tr>
                    <td><label>Full name</label></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><label>Email</label></td>
                    <td><input type="email"></td>
                </tr>

                <tr>
                    <td><label>Mobile Number</label></td>
                    <td><input type="tel" pattern="[0-9]{10}"></td>
                </tr>
               

                <tr>
                    <td><label>address</label></td>
                    <td><textarea name="" id=""></textarea></td>
                </tr>

                <tr>
                    <td><label>Nationality</label></td>
                    <td><input type="text"></td>

                <tr>
                    <td><label>Date of Birth</label></td>
                    <td><input type="date"></td>
                </tr>

                <!-- gendre -->
                <tr>
                    <td><label>Gendre</label></td>
                    <td><input type="radio" id="male" name="gendre" value="Male">
                        <label>Male</label>   

                        <input type="radio" id="female" name="gendre" value="Female">
                        <label>Female</label>
                    </td>
                </tr>

                <tr>
                    <td><label>Highest Degree</label></td>
                    <td>
                       
                    </td>
                </tr>

                <tr>
                    <td><label>Passing Year</label></td>
                    <td>
                        <select>
                            <option selected disabled>Select Passing Year</option>
                            <option>2022</option>
                            <option>2023</option>
                            <option>2024</option>
                            <option>2025</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label>CPI</label></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><label>University</label></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>
                        <button type="submit">submit</button>
                    </td>

                    <td>
                        <button type="reset">cancle</button>
                    </td>
                </tr>

        </table>
    </form>
</body>
</html>
