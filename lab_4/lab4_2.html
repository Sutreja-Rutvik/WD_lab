<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>COVID-19 Vacine registration From</h1>
        <table>
            <tr>
                <td><label>First Name</label></td>
                <td><input type="name"></td>
            </tr>

            <tr>
                <td><label>Last Name</label></td>
                <td><input type="name"></td>
            </tr>
            
            <tr>
                <td><label>Adhar number</label></td>
                <td><input type="number"></td>
            </tr>

           <tr>
                    <td><label>Vaccine Name</label></td>
                    <td>
                        <select>
                            <option selected disabled>Please select vaccine Name</option>
                            <option>vaccine 1</option>
                            <option>vaccine 2</option>
                            <option>vaccine 3</option>     
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label>Vaccine Centre Name</label></td>
                    <td>
                        <select>
                            <option selected disabled>Please select vaccine Centre Name</option>
                            <option>Centre 1</option>
                            <option>Centre 2</option>
                            <option>Centre 3</option>     
                        </select>
                    </td>
                </tr>

                 <tr>
                    <td><label>Date of Birth</label></td>
                    <td><input type="date"></td>
                </tr>
                
                <tr>
                    <td><label>Dose Number</label></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>
                        <button type="submit">submit</button>
                    </td>

                    <td>
                        <button type="reset">cancle</button>
                    </td>
                </tr>

        </table>
    </form>
    
</body>
</html>
